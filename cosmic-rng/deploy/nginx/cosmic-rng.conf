# ============================================================================
# Cosmic RNG — Nginx site configuration
#
#   sudo cp cosmic-rng.conf /etc/nginx/sites-available/cosmic-rng
#   sudo ln -s /etc/nginx/sites-available/cosmic-rng /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d rng.example.com      # issues and wires up TLS
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace rng.example.com with your domain everywhere below.
# ============================================================================

upstream cosmic_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Rate limit zones (generous: the game itself is chatty; abuse is caught here)
limit_req_zone $binary_remote_addr zone=cosmic_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cosmic_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=cosmic_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rng.example.com;

    # Let certbot answer the ACME challenge over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rng.example.com;

    # certbot fills these in; keep the paths in sync if you manage TLS yourself.
    ssl_certificate     /etc/letsencrypt/live/rng.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rng.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/cosmic-rng/frontend/dist;
    index index.html;

    client_max_body_size 2m;
    limit_conn cosmic_conn 40;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---- WebSocket -------------------------------------------------------
    location /ws {
        proxy_pass http://cosmic_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- OAuth endpoints (stricter limit, bursts allowed) ----------------
    location ~ ^/api/auth/(login|callback|dev-login)$ {
        limit_req zone=cosmic_auth burst=10 nodelay;
        proxy_pass http://cosmic_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- API -------------------------------------------------------------
    location /api/ {
        limit_req zone=cosmic_api burst=120 nodelay;
        proxy_pass http://cosmic_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;   # roll responses should reach the player immediately
    }

    # ---- static assets (content-hashed → immutable) ----------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg { expires 7d; access_log off; }

    # ---- SPA fallback ----------------------------------------------------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/cosmic-rng.access.log;
    error_log  /var/log/nginx/cosmic-rng.error.log warn;
}
