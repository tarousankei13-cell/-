name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes mypy

      - name: Lint (pyflakes)
        run: python -m pyflakes *.py tests/*.py

      - name: Static type check (mypy)
        run: |
          python -m mypy --ignore-missing-imports \
            config.py utils.py database.py kyash_service.py price_service.py \
            charge_service.py ui.py commands.py tasks.py main.py

      - name: Startup validation must fail safely without a token
        run: |
          set +e
          python main.py
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "起動前チェックが未設定Tokenを検出できていません (exit=$code)"
            exit 1
          fi

      - name: Integration test (charge flow)
        run: python tests/test_charge_flow.py
        env:
          CHARGE_BOT_TEST_DIR: ${{ runner.temp }}/charge_bot_test

      - name: Integration test (v2 features)
        run: python tests/test_v2_features.py
        env:
          CHARGE_BOT_TEST_DIR: ${{ runner.temp }}/charge_bot_v2_test

      - name: Schema migration test (v1 -> v2)
        run: python tests/test_migration.py
        env:
          CHARGE_BOT_TEST_DIR: ${{ runner.temp }}/charge_bot_migration

      - name: UI render test (embed limits)
        run: python tests/test_ui_render.py

      - name: Provider test (PayPay / LTC requests)
        run: python tests/test_providers.py
        env:
          CHARGE_BOT_TEST_DIR: ${{ runner.temp }}/charge_bot_provider

      - name: Command smoke test (all commands and buttons)
        run: python tests/test_commands_smoke.py
        env:
          CHARGE_BOT_TEST_DIR: ${{ runner.temp }}/charge_bot_smoke
